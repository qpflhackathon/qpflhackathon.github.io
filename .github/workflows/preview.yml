name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          BASE_PATH: /previews/pr-${{ github.event.number }}

      # GitHub Pages runs Jekyll unless .nojekyll is at the branch root, and
      # Jekyll drops folders starting with "_", which removes Next.js' _next/.
      - name: Ensure .nojekyll at gh-pages root
        run: |
          git fetch origin gh-pages
          git worktree add --detach ../gh-pages FETCH_HEAD
          cd ../gh-pages
          if [ ! -f .nojekyll ]; then
            touch .nojekyll
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .nojekyll
            git commit -m "Add .nojekyll so GitHub Pages serves _next/"
            git push origin HEAD:gh-pages
          fi

      - name: Preview Pages
        uses: rajyan/preview-pages@v1
        with:
          source-dir: out
          target-dir: previews # → https://qpflhackathon.github.io/previews/pr-<N>/
          # This is a user/org site served from the domain root; without this the
          # action links to <owner>.github.io/<repo>/..., as for a project site.
          configured-domain: qpflhackathon.github.io
          pr-per-commit: false # one preview per PR, overwritten on each push
          pr-comment: sticky # one comment per PR, updated in place

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview
        run: |
          rm -rf previews/pr-${{ github.event.number }}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || { git commit -m "Remove preview for PR #${{ github.event.number }}"; git push; }
